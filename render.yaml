services:
  - type: web
    name: majisafe-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: majisafe-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false

databases:
  - name: majisafe-db
    databaseName: majisafe
    user: majisafe
