name: probe
on:
  workflow_dispatch:
    inputs:
      db_url:
        description: 'Database URL to verify (run-time input; never stored in the repo)'
        required: true
      api_host:
        description: 'Deployed API base URL'
        required: false
        default: 'https://water-management-system-6lnh.onrender.com'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/43d20033-water-management-system
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify database, then publish findings
        env:
          DB_URL: ${{ inputs.db_url }}
          API_HOST: ${{ inputs.api_host }}
        run: |
          set +e
          cd backend && npm install --no-audit --no-fund >/dev/null 2>&1; cd ..
          export NODE_PATH="$GITHUB_WORKSPACE/backend/node_modules"
          OUT=$GITHUB_WORKSPACE/PROBE.md
          {
            echo "# Verification $(date -u +%FT%TZ)"
            echo
            echo "Target (credentials never printed):"
            echo '```'
            node -e '
              try {
                const u = new URL(process.env.DB_URL);
                console.log("  host     :", u.hostname);
                console.log("  database :", u.pathname.replace(/^\//,""));
                console.log("  user     :", u.username);
                console.log("  sslmode  :", u.searchParams.get("sslmode") || "(none)");
                console.log("  bare internal host?", /^dpg-[a-z0-9]+-a$/.test(u.hostname));
              } catch (e) { console.log("  cannot parse DB_URL:", e.message); }
            '
            echo '```'
            echo
            echo '## 1. Connect'
            echo '```'
            node -e '
              const { Client } = require("pg");
              (async () => {
                const c = new Client({ connectionString: process.env.DB_URL, ssl: { rejectUnauthorized: false }, connectionTimeoutMillis: 25000 });
                c.on("error", (e) => console.log("client error:", e.code || "", e.message));
                try {
                  const t0 = Date.now();
                  await c.connect();
                  console.log("CONNECT OK in " + (Date.now()-t0) + "ms");
                  const v = await c.query("SELECT version() v, current_database() d, current_user u");
                  console.log("  database:", v.rows[0].d, "| user:", v.rows[0].u);
                  console.log("  server  :", String(v.rows[0].v).split(",")[0]);
                  const t = await c.query("SELECT table_name FROM information_schema.tables WHERE table_schema=$1 ORDER BY 1", ["public"]);
                  console.log("  tables  :", t.rows.map(r=>r.table_name).join(", ") || "(none yet)");
                  await c.end();
                } catch (e) {
                  console.log("CONNECT FAILED:", e.code || "ERR", "-", e.message);
                }
              })();
            ' 2>&1
            echo '```'
            echo
            echo '## 2. Apply schema (idempotent)'
            echo '```'
            DATABASE_URL="$DB_URL" node -e '
              try {
                const { migrate } = require("./backend/src/migrate");
                migrate().then(r => console.log(JSON.stringify({ ran: r.ran, reason: r.reason, statements: r.statements, failureCount: (r.failures||[]).length, failures: (r.failures||[]).slice(0,6) }, null, 1)))
                       .catch(e => console.log("migrate threw:", e.message));
              } catch (e) { console.log("migrate load failed:", e.message); }
            ' 2>&1
            echo '```'
            echo
            echo '## 3. Tables + row counts'
            echo '```'
            node -e '
              const { Client } = require("pg");
              (async () => {
                const c = new Client({ connectionString: process.env.DB_URL, ssl: { rejectUnauthorized: false } });
                try {
                  await c.connect();
                  const t = await c.query("SELECT table_name FROM information_schema.tables WHERE table_schema=$1 ORDER BY 1", ["public"]);
                  console.log("tables:", t.rows.map(r=>r.table_name).join(", ") || "(none)");
                  for (const tbl of ["users","devices","readings","reports"]) {
                    try { const r = await c.query("SELECT count(*)::int c FROM " + tbl); console.log("  " + tbl + ":", r.rows[0].c); } catch (e) { console.log("  " + tbl + ":", e.code); }
                  }
                  await c.end();
                } catch (e) { console.log("FAILED:", e.code, e.message); }
              })();
            ' 2>&1
            echo '```'
            echo
            echo '## 4. Live API health'
            echo '```json'
            curl -sS -m 90 "$API_HOST/api/health" 2>&1 | head -c 2500
            echo
            echo '```'
            echo '## 5. Live login (deliberately wrong credentials)'
            echo '```'
            curl -sS -m 90 -o /tmp/l.json -w 'HTTP %{http_code}\n' -H 'Content-Type: application/json' \
              -H 'Origin: https://water-management-system-two.vercel.app' \
              -d '{"email":"nobody@example.com","password":"x"}' "$API_HOST/api/auth/login" 2>&1
            head -c 400 /tmp/l.json 2>/dev/null
            echo
            echo '```'
          } > "$OUT"
          git config user.name "verify-bot"
          git config user.email "verify@users.noreply.github.com"
          git add PROBE.md
          git commit -m "verify: db + api results [skip ci]" || echo "no change"
          git push origin HEAD:probe-results --force || echo "push failed"
          exit 0
